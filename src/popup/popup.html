<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SERP Reader</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0; padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #202124; background: #fff;
      }
      h1 { margin: 0 0 2px; font-size: 15px; }
      .sub { color: #5f6368; font-size: 11.5px; margin-bottom: 12px; word-break: break-word; }
      .rule { height: 1px; background: #ecedef; margin: 12px 0; }
      .stats { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 12.5px; }
      .stats .k { color: #5f6368; }
      .stats .v { font-weight: 600; font-variant-numeric: tabular-nums; }
      button {
        width: 100%; padding: 9px 10px; margin-top: 8px; font: inherit; font-weight: 600;
        border-radius: 6px; border: 1px solid #dadce0; background: #fff; color: #202124; cursor: pointer;
      }
      button:hover { background: #f8f9fa; }
      button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
      button.primary:hover { background: #1765cc; }
      button:disabled { opacity: .55; cursor: default; }
      .msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
      .msg.ok { color: #188038; }
      .msg.error { color: #c5221f; }
      .msg.busy { color: #b06000; }
      label.check { display: flex; gap: 7px; align-items: center; margin-top: 9px; font-size: 12px; color: #3c4043; }
      label.check input { margin: 0; }
      details { margin-top: 10px; }
      summary { cursor: pointer; font-size: 12px; color: #5f6368; }
      pre {
        margin: 8px 0 0; padding: 8px; background: #f8f9fa; border-radius: 6px;
        font-size: 11px; max-height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      }
      .row { display: flex; gap: 8px; }
      .row button { margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>SERP Reader</h1>
    <div class="sub" id="context">Checking this tab…</div>

    <div class="rule"></div>

    <div class="stats">
      <span class="k">Organic results</span><span class="v" id="s-organic">–</span>
      <span class="k">People Also Ask</span><span class="v" id="s-paa">–</span>
      <span class="k">SERP features</span><span class="v" id="s-features">–</span>
      <span class="k">AI Overview</span><span class="v" id="s-aio">–</span>
      <span class="k">Saved captures</span><span class="v" id="s-total">–</span>
    </div>

    <label class="check"><input type="checkbox" id="expand-paa" /> Expand PAA answers (slower)</label>
    <label class="check"><input type="checkbox" id="raw-html" checked /> Keep raw HTML snapshot</label>

    <button class="primary" id="collect">Collect SERP</button>
    <div class="row">
      <button id="history">History</button>
      <button id="export">Export all</button>
    </div>

    <div class="msg" id="msg"></div>

    <details id="diag-wrap" hidden>
      <summary>Diagnostics</summary>
      <pre id="diag"></pre>
    </details>

    <script src="popup.js" type="module"></script>
  </body>
</html>
